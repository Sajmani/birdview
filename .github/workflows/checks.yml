# The standing checks, on every push to main and every pull request
# (tech.checksOnEveryChange). The dataset is built first and Chrome is on the
# runner, so no test has a reason to skip, and a skip fails the run.
#
# Only GitHub's own actions, pinned to commits; read-only; no secrets.
# TestChecksWorkflow holds this file to that.

name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Named explicitly: only then does GitHub add -o pipefail, without
        # which `go test | tee` would pass a failing run.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: Build the dataset
        run: go run ./cmd/birdview-ingest
      - name: go test
        run: go test -v ./... 2>&1 | tee test.log
      - name: No test skipped
        run: |
          if grep -E '^\s*--- SKIP' test.log; then
            echo "A skip is not a pass: every test can run here."
            exit 1
          fi

  # Checks river/ with River's CLI, built at the pin in .agents/skills/PROVENANCE.md.
  # Runs once the repository variable RIVER_REPO names a clonable River repository;
  # pull requests pass --allow-unapproved until the owner approves, pushes to main
  # require full approval.
  river:
    runs-on: ubuntu-latest
    if: ${{ vars.RIVER_REPO != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build river at the skill's pin
        env:
          RIVER_REPO: ${{ vars.RIVER_REPO }}
        run: |
          pin="$(sed -n 's/^| Pin | `\(.*\)` |$/\1/p' .agents/skills/PROVENANCE.md)"
          test -n "$pin"
          git clone --quiet "$RIVER_REPO" "$RUNNER_TEMP/river-src"
          git -C "$RUNNER_TEMP/river-src" checkout --quiet "$pin"
          (cd "$RUNNER_TEMP/river-src" && go build -o "$RUNNER_TEMP/river" ./cmd/river)
      - name: river check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            "$RUNNER_TEMP/river" check --allow-unapproved river
          else
            "$RUNNER_TEMP/river" check river
          fi
